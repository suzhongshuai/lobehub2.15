name: Build LobeHub for Serv00
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm run build
        env:
          NEXT_PUBLIC_SERVICE_MODE: server
          # 核心：这两行会命令 Next.js 无视你刚才看到的那些红字报错
          NEXTJS_IGNORE_TYPE_CHECKS: true
          NEXTJS_IGNORE_ESLINT: true
          # 给够内存，防止构建中途崩溃
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Prepare Artifact
        run: |
          mkdir release
          cp -r .next release/
          cp -r public release/
          cp package.json release/
          zip -r lobehub-serv00.zip release/

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: lobehub-build-package
          path: lobehub-serv00.zip
